name: Data Ingest

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:  # Manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: |
          cd ingest
          pip install -r requirements.txt

      - name: Run ingest
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
          EIA_KEY: ${{ secrets.EIA_KEY }}
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
          ALPHA_KEY: ${{ secrets.ALPHA_KEY }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          cd ingest
          python run_all.py

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ingest-data
          path: data/
          retention-days: 1

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Ingest failed',
              body: `Ingest workflow failed at ${new Date().toISOString()}\n\nWorkflow: ${context.workflow}\nRun: ${context.runId}\n\nCheck logs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })