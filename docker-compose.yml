# Docker Compose for Shared WorldMonitor Dev Environment
# Usage: docker-compose up -d
# Each developer can connect via VS Code "Attach to Container"
# Or use as a shared dev server on a VPS

version: '3.8'

services:
  # Main development container
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: worldmonitor-dev
    hostname: worldmonitor-dev
    
    # Run as non-root
    user: "node"
    
    # Working directory
    working_dir: /workspace
    
    # Volume mounts
    volumes:
      # Project code (live reload)
      - .:/workspace:cached
      # Node modules cache (faster installs)
      - node_modules:/workspace/node_modules
      - pnpm_store:/home/node/.pnpm-store
      # Cloudflare credentials (read-only)
      - ~/.cloudflared:/home/node/.cloudflared:ro
      # SSH keys for git (read-only)
      - ~/.ssh:/home/node/.ssh:ro
      # 1Password/Bitwarden socket (if using)
      - ~/.1password:/home/node/.1password:ro
    
    # Environment
    environment:
      - NODE_ENV=development
      - MCP_HTTP_PORT=3001
      - PORT=3000
      # Secrets injected at runtime via .env file (gitignored)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GDELT_API_KEY=${GDELT_API_KEY}
    
    # Ports (exposed to host)
    ports:
      - "3000:3000"  # Website dev server
      - "3001:3001"  # MCP HTTP wrapper
      - "3002:3002"  # Ruflo API (if used)
      - "8080:8080"  # Cloudflare tunnel metrics
    
    # Keep running
    command: sleep infinity
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits (adjust for your machine)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Optional: Shared PostgreSQL for data persistence
  postgres:
    image: postgres:16-alpine
    container_name: worldmonitor-postgres
    environment:
      - POSTGRES_DB=worldmonitor
      - POSTGRES_USER=worldmonitor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-worldmonitor_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldmonitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: worldmonitor-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Cloudflare Tunnel as a service
  # Run this on ONE machine, others connect via VPN/Tailscale
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: worldmonitor-tunnel
    command: tunnel run worldmonitor-dev
    volumes:
      - ~/.cloudflared:/home/nonroot/.cloudflared:ro
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - dev
    # Only enable if running on dedicated tunnel host
    profiles:
      - tunnel

volumes:
  node_modules:
  pnpm_store:
  postgres_data:
  redis_data:

networks:
  default:
    name: worldmonitor-network