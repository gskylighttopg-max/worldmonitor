name = "worldmonitor-api"
main = "workers/api.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[kv_namespaces]
binding = "NEWS_KV"
id = "<YOUR_KV_NAMESPACE_ID>"
preview_id = "<YOUR_PREVIEW_KV_NAMESPACE_ID>"

[triggers]
crons = ["*/2 * * * *"]

[build]
command = ""

[dev]
port = 8787
ip = "127.0.0.1"