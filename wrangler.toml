name = "worldmonitor-api"
main = "workers/api.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[kv_namespaces]
binding = "NEWS_KV"
id = "<YOUR_KV_NAMESPACE_ID>"
preview_id = "<YOUR_PREVIEW_KV_NAMESPACE_ID>"

# TO DEPLOY:
# 1. Run: wrangler kv:namespace create "NEWS_KV"
# 2. Copy the returned ID to 'id' above
# 3. Run: wrangler kv:namespace create "NEWS_KV" --preview
# 4. Copy the returned ID to 'preview_id' above

# Cron trigger removed - ingest runs via GitHub Actions every 15 min
# Cloudflare Worker is an API server, not the ingest script

[build]
command = ""

[dev]
port = 8787
ip = "127.0.0.1"